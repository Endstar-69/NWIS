version: '3.8'

services:
  # =================================================================
  # NWIS Backend Service: FastAPI, ML Risk Engine, RAG & Telemetry
  # =================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nwis-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=False
      - SECRET_KEY=nwis_oil_india_production_secret_key_demo
      - DATABASE_URL=sqlite:////app/data/nwis.db
      - AI_DEMO_MODE=True
      - SIMULATOR_TICK_SECONDS=2.0
    volumes:
      - nwis_data:/app/data
      - ./artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system/status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # =================================================================
  # NWIS Frontend Service: React + Vite Single Page App via Nginx
  # =================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nwis-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  nwis_data:
    name: nwis_data_volume
